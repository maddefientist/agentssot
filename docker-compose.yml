services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentssot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./api
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: agentssot-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Override the stale .env OLLAMA_CHAT_MODEL (was qwen3:latest -> 404 on the
      # Ollama server, which breaks /distill AND summarize). qwen3.6:27b is
      # present and verified working. Move this into .env when convenient.
      OLLAMA_CHAT_MODEL: qwen3.6:27b
    extra_hosts:
      # Allows reaching Ollama running on the Docker host via http://host.docker.internal:11434
      # (works on Linux with Docker 20.10+ / Compose v2).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Read-only: /doctor reports freshness (mtimes, .last_success) without
      # ever reading dump contents. The API must never be able to write here.
      - ./backups:/backups:ro
    ports:
      - "${API_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: agentssot-backup
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        mkdir -p /backups
        chmod 700 /backups

        dump_and_validate() {
          ts="$(date +%Y%m%d_%H%M%S)"
          outfile="/backups/ssot_$${ts}.dump"
          partfile="$${outfile}.part"
          pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "$$partfile"
          fsize="$(stat -c%s "$$partfile" 2>/dev/null || echo 0)"
          if [ "$$fsize" -le 0 ]; then
            echo "[WARN] backup $$partfile is empty ($$fsize bytes)"
            rm -f "$$partfile"
            return 1
          fi
          # Validate the archive's table-of-contents BEFORE it is ever named
          # a real .dump file or counted as a success — a corrupt/truncated
          # dump must never look like a good backup.
          if ! pg_restore --list "$$partfile" >/dev/null 2>&1; then
            echo "[WARN] backup $$partfile failed pg_restore --list validation"
            rm -f "$$partfile"
            return 1
          fi
          # Atomic rename: readers only ever see a complete, validated file
          # at the final .dump path.
          mv "$$partfile" "$$outfile"
          echo "[OK] backup $$outfile ($$fsize bytes, validated)"
          date -u +%Y-%m-%dT%H:%M:%SZ > /backups/.last_success
          return 0
        }

        while true; do
          if ! dump_and_validate; then
            echo "[WARN] retrying backup in 60s..."
            sleep 60
            dump_and_validate || echo "[WARN] backup retry also failed; will try again next cycle"
          fi
          find /backups -type f -name '*.dump.part' -mmin +60 -delete || true
          find /backups -type f -name '*.dump' -size 0 -delete || true
          find /backups -type f -name '*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete || true
          sleep 86400
        done
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: agentssot-pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    profiles: ["pgadmin"]
    restart: unless-stopped

  db-port:
    image: alpine/socat:1.8.0.3-r2
    container_name: agentssot-db-port
    depends_on:
      db:
        condition: service_healthy
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:db:5432"]
    ports:
      - "5432:5432"
    profiles: ["db-port"]
    restart: unless-stopped
